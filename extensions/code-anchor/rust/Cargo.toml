[package]
name = "code-anchor-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ast-grep-core = "=0.39.9"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
parking_lot = "0.12"
memchr = "2"
ignore = "0.4"
regex = "1"
thiserror = "2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
tree-sitter = "=0.25.10"
tree-sitter-language = "=0.1.7"
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh64"] }

[patch.crates-io]
tree-sitter = { path = "vendor/tree-sitter" }

[dev-dependencies]
tempfile = "3"
globset = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
cc = "=1.11.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
